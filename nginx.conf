user nginx;
worker_processes auto;
events {worker_connections 1024;}
http {
  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","status":$status,"upstream":"$upstream_addr","duration":$request_time}';
  access_log /var/log/nginx/access.log json;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  upstream backend {
    least_conn;
    server backend-a:8080 max_fails=3 fail_timeout=10s;
    server backend-b:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }
  server {
    listen 80;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location = /health {access_log off; return 200 "ok\n";}
    location / {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
