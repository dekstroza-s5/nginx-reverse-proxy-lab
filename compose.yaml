services:
  nginx:
    image: nginx:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    depends_on: [backend-a, backend-b]
  backend-a:
    image: mendhak/http-https-echo:35
    environment: {HTTP_PORT: "8080", ECHO_INCLUDE_ENV_VARS: "1", INSTANCE: backend-a}
  backend-b:
    image: mendhak/http-https-echo:35
    environment: {HTTP_PORT: "8080", ECHO_INCLUDE_ENV_VARS: "1", INSTANCE: backend-b}
